<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retr01-A Compact Layout</title>
</head>
<body style="background-color: #111; display: flex; justify-content: center; padding: 2rem;">

  <svg width="170mm" height="160mm" viewBox="0 0 170 160" xmlns="http://www.w3.org/2000/svg" style="background-color: #163622; border: 2px solid #bfa15f; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
    
    <style>
      .grid { stroke: #1f4a2f; stroke-width: 0.5; }
      .via { fill: #bfa15f; }
      .chip { fill: #1c1c1c; stroke: #333333; stroke-width: 0.5; rx: 0.5; ry: 0.5; }
      .pin { stroke: #888888; stroke-width: 1.2; stroke-dasharray: 0.8 1.54; }
      .notch { fill: none; stroke: #444444; stroke-width: 0.6; }
      .silkscreen { fill: #e0e0e0; font-family: monospace; font-size: 2.2px; font-weight: bold; }
      .silkscreen-sm { fill: #aaaaaa; font-family: monospace; font-size: 1.5px; }
      .trace { stroke: #2a613d; stroke-width: 0.3; fill: none; }
    </style>

    <!-- 10mm Background Grid for Scale -->
    <pattern id="grid-large" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" class="grid" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid-large)" />

    <!-- Mounting Holes -->
    <circle cx="5" cy="5" r="2" class="via" />
    <circle cx="165" cy="5" r="2" class="via" />
    <circle cx="5" cy="155" r="2" class="via" />
    <circle cx="165" cy="155" r="2" class="via" />

    <!-- Reusable Component Definitions -->
    <defs>
      <g id="dip40">
        <line x1="-0.5" y1="2" x2="-0.5" y2="50" class="pin" />
        <line x1="15.7" y1="2" x2="15.7" y2="50" class="pin" />
        <rect x="0" y="0" width="15.2" height="52" class="chip" />
        <path d="M 5.6 0 A 2 2 0 0 0 9.6 0" class="notch" />
      </g>
      <g id="dip32W">
        <line x1="-0.5" y1="2" x2="-0.5" y2="40" class="pin" />
        <line x1="15.7" y1="2" x2="15.7" y2="40" class="pin" />
        <rect x="0" y="0" width="15.2" height="42" class="chip" />
        <path d="M 5.6 0 A 2 2 0 0 0 9.6 0" class="notch" />
      </g>
      <g id="dip28">
        <line x1="-0.5" y1="2" x2="-0.5" y2="33" class="pin" />
        <line x1="8.1" y1="2" x2="8.1" y2="33" class="pin" />
        <rect x="0" y="0" width="7.6" height="34.8" class="chip" />
        <path d="M 2.8 0 A 1 1 0 0 0 4.8 0" class="notch" />
      </g>
      <g id="dip24">
        <line x1="-0.5" y1="2" x2="-0.5" y2="30" class="pin" />
        <line x1="8.1" y1="2" x2="8.1" y2="30" class="pin" />
        <rect x="0" y="0" width="7.6" height="32" class="chip" />
        <path d="M 2.8 0 A 1 1 0 0 0 4.8 0" class="notch" />
      </g>
      <g id="dip20">
        <line x1="-0.5" y1="2" x2="-0.5" y2="24" class="pin" />
        <line x1="8.1" y1="2" x2="8.1" y2="24" class="pin" />
        <rect x="0" y="0" width="7.6" height="26" class="chip" />
        <path d="M 2.8 0 A 1 1 0 0 0 4.8 0" class="notch" />
      </g>
      <g id="dip16">
        <line x1="-0.5" y1="2" x2="-0.5" y2="18" class="pin" />
        <line x1="8.1" y1="2" x2="8.1" y2="18" class="pin" />
        <rect x="0" y="0" width="7.6" height="19.5" class="chip" />
        <path d="M 2.8 0 A 1 1 0 0 0 4.8 0" class="notch" />
      </g>
      <g id="dip14">
        <line x1="-0.5" y1="2" x2="-0.5" y2="16" class="pin" />
        <line x1="8.1" y1="2" x2="8.1" y2="16" class="pin" />
        <rect x="0" y="0" width="7.6" height="17.5" class="chip" />
        <path d="M 2.8 0 A 1 1 0 0 0 4.8 0" class="notch" />
      </g>
    </defs>

    <!-- ROW 1: Heavy Processors & Memory -->
    <use href="#dip40" x="10" y="10" />
    <text x="17.6" y="36" class="silkscreen" transform="rotate(-90 17.6 36)">W65C02S (CPU)</text>

    <use href="#dip40" x="28" y="10" />
    <text x="35.6" y="36" class="silkscreen" transform="rotate(-90 35.6 36)">ATMEGA1284P (SPRITE)</text>

    <use href="#dip32W" x="46" y="10" />
    <text x="53.6" y="31" class="silkscreen" transform="rotate(-90 53.6 31)">FLASH ROM</text>

    <use href="#dip28" x="64" y="10" />
    <text x="67.8" y="27" class="silkscreen" transform="rotate(-90 67.8 27)">AUDIO MCU</text>

    <use href="#dip28" x="74" y="10" />
    <text x="77.8" y="27" class="silkscreen" transform="rotate(-90 77.8 27)">SYS RAM</text>

    <use href="#dip28" x="84" y="10" />
    <text x="87.8" y="27" class="silkscreen" transform="rotate(-90 87.8 27)">VID RAM</text>

    <use href="#dip28" x="94" y="10" />
    <text x="97.8" y="27" class="silkscreen" transform="rotate(-90 97.8 27)">OAM BUF</text>

    <use href="#dip28" x="104" y="10" />
    <text x="107.8" y="27" class="silkscreen" transform="rotate(-90 107.8 27)">EEPROM</text>

    <use href="#dip16" x="116" y="10" />
    <text x="119.8" y="19" class="silkscreen-sm" transform="rotate(-90 119.8 19)">74HC157</text>

    <use href="#dip16" x="126" y="10" />
    <text x="129.8" y="19" class="silkscreen-sm" transform="rotate(-90 129.8 19)">74HC157</text>

    <!-- Power & Clock Corner -->
    <rect x="140" y="10" width="12" height="8" fill="#111" />
    <text x="146" y="15" class="silkscreen-sm" text-anchor="middle">5V REG</text>
    <rect x="140" y="22" width="10" height="10" fill="#ddd" />
    <text x="145" y="35" class="silkscreen-sm" text-anchor="middle">8 MHz</text>
    <rect x="140" y="40" width="10" height="10" fill="#ddd" />
    <text x="145" y="53" class="silkscreen-sm" text-anchor="middle">21 MHz</text>

    <!-- ROW 2: Decoders, Latches, Transceivers -->
    <use href="#dip24" x="10" y="70" />
    <use href="#dip24" x="20" y="70" />
    <use href="#dip24" x="30" y="70" />
    <text x="24" y="105" class="silkscreen-sm" text-anchor="middle">GAL22V10 (x3)</text>

    <use href="#dip20" x="42" y="70" />
    <use href="#dip20" x="52" y="70" />
    <use href="#dip20" x="62" y="70" />
    <use href="#dip20" x="72" y="70" />
    <use href="#dip20" x="82" y="70" />
    <use href="#dip20" x="92" y="70" />
    <use href="#dip20" x="102" y="70" />
    <text x="76" y="99" class="silkscreen-sm" text-anchor="middle">74HC573 LATCHES (x7)</text>

    <use href="#dip20" x="114" y="70" />
    <use href="#dip20" x="124" y="70" />
    <use href="#dip20" x="134" y="70" />
    <text x="128" y="99" class="silkscreen-sm" text-anchor="middle">74HC245 (x3)</text>

    <!-- ROW 3: Counters & High-Density Glue Logic -->
    <use href="#dip16" x="10" y="112" />
    <use href="#dip16" x="20" y="112" />
    <use href="#dip16" x="30" y="112" />
    <use href="#dip16" x="40" y="112" />
    <text x="29" y="134" class="silkscreen-sm" text-anchor="middle">74HC161 (x4)</text>

    <!-- 20 Glue Logic Chips packed tightly (10mm pitch) -->
    <use href="#dip14" x="52" y="112" />
    <use href="#dip14" x="62" y="112" />
    <use href="#dip14" x="72" y="112" />
    <use href="#dip14" x="82" y="112" />
    <use href="#dip14" x="92" y="112" />
    <use href="#dip14" x="102" y="112" />
    <use href="#dip14" x="112" y="112" />
    <use href="#dip14" x="122" y="112" />
    <use href="#dip14" x="132" y="112" />
    <use href="#dip14" x="142" y="112" />

    <use href="#dip14" x="52" y="135" />
    <use href="#dip14" x="62" y="135" />
    <use href="#dip14" x="72" y="135" />
    <use href="#dip14" x="82" y="135" />
    <use href="#dip14" x="92" y="135" />
    <use href="#dip14" x="102" y="135" />
    <use href="#dip14" x="112" y="135" />
    <use href="#dip14" x="122" y="135" />
    <use href="#dip14" x="132" y="135" />
    <use href="#dip14" x="142" y="135" />

    <text x="101" y="155" class="silkscreen-sm" text-anchor="middle">MIXED GLUE LOGIC (x20)</text>

    <!-- 40-Pin I/O Header -->
    <rect x="156" y="55" width="8" height="50" fill="#111" />
    <text x="160" y="80" class="silkscreen" transform="rotate(-90 160 80)">40-PIN I/O</text>

  </svg>

</body>
</html>
